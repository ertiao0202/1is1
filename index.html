<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FactLens – Instant Article Bias Check</title>
    <link rel="stylesheet" href="main.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>FactLens</h1>
            <p>Instant Article Bias Check</p>
        </header>
        
        <main>
            <div class="input-section">
                <textarea id="articleInput" placeholder="Paste article text here or enter URL..."></textarea>
                <div class="button-group">
                    <button id="analyzeBtn">Analyze Bias</button>
                    <button id="clearBtn">Clear</button>
                </div>
            </div>
            
            <div id="results" class="results-section" style="display: none;">
                <h2>Analysis Results</h2>
                <div id="biasScore" class="score-display"></div>
                <div id="biasDetails" class="details"></div>
            </div>
        </main>
        
        <footer>
            <a href="privacy.html">Privacy Policy</a>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
